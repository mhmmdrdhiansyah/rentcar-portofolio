name: letsride

services:
  app:
    build: .
    image: letsride-app
    container_name: letsride-app
    restart: unless-stopped
    user: root
    command: >-
      sh -c "chmod -R ug+rwX storage bootstrap/cache
      && chown -R www-data:www-data storage bootstrap/cache
      && php-fpm"
    volumes:
      - .:/var/www/html
      - ./public/build:/var/www/html/public/build
    networks:
      - mysql_net
      - web

  nginx:
    image: nginx:alpine
    container_name: letsride-nginx
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - web

networks:
  # Existing MySQL container ("mysql") runs on this network
  mysql_net:
    external: true
  web:
    driver: bridge
